    <rect x="986" y="130" width="70" height="20" rx="5" fill="#E8542F" fill-opacity="0.05"><animate attributeName="fill-opacity" values="0.05;0.22;0.05" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="986" y="160" width="70" height="20" rx="5" fill="#E8542F" fill-opacity="0.05"><animate attributeName="fill-opacity" values="0.05;0.22;0.05" begin="1s" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="986" y="190" width="70" height="20" rx="5" fill="#E8542F" fill-opacity="0.05"><animate attributeName="fill-opacity" values="0.05;0.22;0.05" begin="2s" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="1080" y="100" width="94" height="196" rx="14" stroke-width="1.5"/>
    <rect x="1087" y="140" width="30" height="22" rx="4"><animate attributeName="stroke-opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="1123" y="140" width="30" height="22" rx="4"><animate attributeName="stroke-opacity" values="0.25;1;0.25" begin="0.8s" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="1105" y="172" width="30" height="22" rx="4"><animate attributeName="stroke-opacity" values="0.25;1;0.25" begin="1.6s" dur="2.4s" repeatCount="indefinite"/></rect>
    <line x1="1087" y1="252" x2="1153" y2="252" stroke-dasharray="4 4"/>
    <circle cx="1153" cy="252" r="3"/>

    <!-- notes glyphs -->
    <rect x="868" y="362" width="11" height="11"/>
    <rect x="868" y="388" width="11" height="11" rx="3"/>
    <line x1="868" y1="418" x2="879" y2="418" stroke-dasharray="3 3"/>
    <circle cx="873.5" cy="442" r="5.5"/>

