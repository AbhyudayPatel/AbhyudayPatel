    <line x1="884" y1="580" x2="884" y2="592"/>
    <line x1="992" y1="580" x2="992" y2="592"/>
    <line x1="1004" y1="514" x2="1004" y2="570"/>
    <line x1="998" y1="514" x2="1010" y2="514"/>
