        <line x1="430" y1="142" x2="430" y2="194"/>
        <line x1="456" y1="168" x2="404" y2="168"/>
        <line x1="448" y1="150" x2="412" y2="186"/>
        <line x1="412" y1="150" x2="448" y2="186"/>
        <line x1="444" y1="146" x2="416" y2="190"/>
        <line x1="416" y1="146" x2="444" y2="190"/>
