      <text x="336" y="542">LLM SYSTEMS &#183; SHIPPED</text>
      <text x="58" y="587">1.0 &#8212; SERVING LOOP</text>
      <text x="336" y="587">SHIPPING</text>
    </g>
    <circle cx="424" cy="583" r="4" fill="#E8542F" stroke="none">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
