<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Abhyuday Patel — LLM inference pipeline to production</title>
  <desc id="description">Animated HUD showing tokens flowing through LLM inference stages — tokenize, prefill, KV cache, decode, route — into deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091322"/>
      <stop offset="1" stop-color="#0f2c42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57c4ff"/>
      <stop offset="1" stop-color="#74e2bd"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#79b5d7" stroke-opacity="0.06"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="428" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Arial, Helvetica, sans-serif">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <circle cx="1160" cy="-30" r="200" fill="none" stroke="#57c4ff" stroke-opacity="0.10"/>
    <circle cx="20" cy="460" r="170" fill="none" stroke="#74e2bd" stroke-opacity="0.08"/>

    <!-- scanline -->
    <rect y="66" width="2" height="300" fill="#57c4ff" opacity="0.05">
      <animate attributeName="x" values="40;1160" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- header -->
    <text x="48" y="37" fill="#8fb6cf" font-size="12" font-weight="700" letter-spacing="2">&#9672; PLAYER // ABHYUDAY PATEL</text>
    <circle cx="1058" cy="33" r="4" fill="#57c4ff"/>
    <circle cx="1074" cy="33" r="4" fill="#a9a1ff"/>
    <circle cx="1090" cy="33" r="4" fill="#74e2bd"/>
    <circle cx="1120" cy="33" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="1134" y="37" fill="#4ade80" font-size="11" font-weight="700" letter-spacing="2">LIVE</text>
    <path d="M48 58H1152" stroke="#29465d"/>

    <!-- title -->
    <text x="56" y="148" fill="#f2f7fb" font-size="50" font-weight="700" letter-spacing="-1">Abhyuday Patel</text>
    <text x="56" y="186" fill="#7fd0ff" font-size="18" letter-spacing="1.5">LLM INFERENCE &#183; BACKEND SYSTEMS &#183; DEPLOYMENT</text>
    <text x="56" y="212" fill="#b9c9d6" font-size="14.5">From model execution to production systems.</text>

    <!-- player HUD -->
    <rect x="700" y="88" width="444" height="140" rx="12" fill="#0d2033" stroke="#2b4e67"/>
    <circle cx="722" cy="113" r="3.5" fill="#57c4ff"/>
    <text x="738" y="117" fill="#6f94ad" font-size="10" letter-spacing="1.6">CLASS</text>
    <text x="822" y="117" fill="#e1edf5" font-size="13" font-weight="700">AI SYSTEMS ENGINEER</text>
    <circle cx="722" cy="139" r="3.5" fill="#a9a1ff"/>
    <text x="738" y="143" fill="#6f94ad" font-size="10" letter-spacing="1.6">GUILD</text>
    <text x="822" y="143" fill="#e1edf5" font-size="13" font-weight="700">LOCALHOST HQ FOUNDERS</text>
    <circle cx="722" cy="165" r="3.5" fill="#74e2bd"/>
    <text x="738" y="169" fill="#6f94ad" font-size="10" letter-spacing="1.6">BASE</text>
    <text x="822" y="169" fill="#e1edf5" font-size="13" font-weight="700">BENGALURU &#183; INDIA</text>
    <text x="738" y="203" fill="#6f94ad" font-size="10" letter-spacing="1.6">PRODUCTION XP</text>
    <rect x="858" y="194" width="212" height="10" rx="5" fill="#16314a"/>
    <rect x="858" y="194" height="10" rx="5" fill="url(#accent)" width="0">
      <animate attributeName="width" values="0;186" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
    </rect>
    <text x="1128" y="203" text-anchor="end" fill="#7fd0ff" font-size="10" font-weight="700">2+ YRS</text>

    <!-- pipeline label -->
    <text x="56" y="258" fill="#6f94ad" font-size="11" font-weight="700" letter-spacing="2">INFERENCE &#9656; PRODUCTION PIPELINE</text>
    <text x="1144" y="258" text-anchor="end" fill="#6f94ad" font-size="11" letter-spacing="1.5">tokens &#9656;&#9656;&#9656;</text>

    <!-- connectors with animated flow -->
    <g stroke="#3d6a8a" stroke-width="2" stroke-dasharray="7 9">
      <line x1="143" y1="316" x2="293" y2="316"><animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/></line>
      <line x1="339" y1="316" x2="489" y2="316"><animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/></line>
      <line x1="535" y1="316" x2="685" y2="316"><animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/></line>
      <line x1="731" y1="316" x2="881" y2="316"><animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/></line>
      <line x1="927" y1="316" x2="1077" y2="316"><animate attributeName="stroke-dashoffset" values="16;0" dur="0.8s" repeatCount="indefinite"/></line>
    </g>

    <!-- stage nodes -->
    <g font-weight="700" text-anchor="middle">
      <circle cx="120" cy="316" r="23" fill="#0d2033" stroke="#57c4ff" stroke-width="1.5"/>
      <text x="120" y="321" fill="#57c4ff" font-size="13">TK</text>
      <circle cx="316" cy="316" r="23" fill="#0d2033" stroke="#6ea8fe" stroke-width="1.5"/>
      <text x="316" y="321" fill="#6ea8fe" font-size="13">PF</text>
      <circle cx="512" cy="316" r="23" fill="#0d2033" stroke="#a9a1ff" stroke-width="1.5"/>
      <text x="512" y="321" fill="#a9a1ff" font-size="13">KV</text>
      <circle cx="708" cy="316" r="23" fill="#0d2033" stroke="#74e2bd" stroke-width="1.5"/>
      <text x="708" y="321" fill="#74e2bd" font-size="13">DC</text>
      <circle cx="904" cy="316" r="23" fill="#0d2033" stroke="#ffd166" stroke-width="1.5"/>
      <text x="904" y="321" fill="#ffd166" font-size="13">RT</text>
      <circle cx="1100" cy="316" r="23" fill="#0d2033" stroke="#4ade80" stroke-width="1.5"/>
      <text x="1100" y="321" fill="#4ade80" font-size="13">DP</text>
    </g>

    <!-- stage labels -->
    <g text-anchor="middle">
      <text x="120" y="358" fill="#c7d6e2" font-size="12" font-weight="600">TOKENIZE</text>
      <text x="120" y="374" fill="#6f94ad" font-size="9.5">byte-level bpe</text>
      <text x="316" y="358" fill="#c7d6e2" font-size="12" font-weight="600">PREFILL</text>
      <text x="316" y="374" fill="#6f94ad" font-size="9.5">attention</text>
      <text x="512" y="358" fill="#c7d6e2" font-size="12" font-weight="600">KV CACHE</text>
      <text x="512" y="374" fill="#6f94ad" font-size="9.5">paged blocks</text>
      <text x="708" y="358" fill="#c7d6e2" font-size="12" font-weight="600">DECODE</text>
      <text x="708" y="374" fill="#6f94ad" font-size="9.5">token streams</text>
      <text x="904" y="358" fill="#c7d6e2" font-size="12" font-weight="600">ROUTE</text>
      <text x="904" y="374" fill="#6f94ad" font-size="9.5">fallbacks on</text>
      <text x="1100" y="358" fill="#c7d6e2" font-size="12" font-weight="600">DEPLOY</text>
      <text x="1100" y="374" fill="#6f94ad" font-size="9.5">containers</text>
    </g>

    <!-- deploy containers spawning -->
    <g fill="none" stroke="#4ade80" stroke-width="1.2" opacity="0.85">
      <rect x="1076" y="280" width="15" height="11" rx="2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="1097" y="280" width="15" height="11" rx="2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="1118" y="280" width="15" height="11" rx="2">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- flowing tokens -->
    <g>
      <circle r="4.5" fill="#eaf6ff" stroke="#57c4ff" stroke-width="1.2">
        <animateMotion dur="5.2s" repeatCount="indefinite" path="M 120 316 H 1080"/>
      </circle>
      <circle r="4.5" fill="#eaf6ff" stroke="#74e2bd" stroke-width="1.2">
        <animateMotion dur="5.2s" begin="-1.04s" repeatCount="indefinite" path="M 120 316 H 1080"/>
      </circle>
      <circle r="4.5" fill="#eaf6ff" stroke="#a9a1ff" stroke-width="1.2">
        <animateMotion dur="5.2s" begin="-2.08s" repeatCount="indefinite" path="M 120 316 H 1080"/>
      </circle>
      <circle r="4.5" fill="#eaf6ff" stroke="#57c4ff" stroke-width="1.2">
        <animateMotion dur="5.2s" begin="-3.12s" repeatCount="indefinite" path="M 120 316 H 1080"/>
      </circle>
      <circle r="4.5" fill="#eaf6ff" stroke="#ffd166" stroke-width="1.2">
        <animateMotion dur="5.2s" begin="-4.16s" repeatCount="indefinite" path="M 120 316 H 1080"/>
      </circle>
    </g>

    <!-- quest log -->
    <rect x="0" y="398" width="1200" height="32" fill="#0b1a2a"/>
    <text x="56" y="419" fill="#9dbbd0" font-size="11.5" letter-spacing="0.5">QUESTS &#9656;  <tspan fill="#74e2bd">&#10003;</tspan> 5B+ TOKENS/MO @ ORBITRAGE    <tspan fill="#74e2bd">&#10003;</tspan> MEMGRAPH &#8594; FALKORDB @ TIMELN    <tspan fill="#74e2bd">&#10003;</tspan> DUOTALK ON PYPI    <tspan fill="#ffd166">&#9654;</tspan> NEXT: AUDIO + VIDEO GENERATION</text>

    <rect x="56" y="424" width="1088" height="2" rx="1" fill="url(#accent)" opacity="0.8"/>
  </g>
  <rect x="1" y="1" width="1198" height="428" rx="22" fill="none" stroke="#2b4e67"/>
</svg>
