    <text x="214" y="162" font-size="9" text-anchor="middle">The</text>
    <text x="260" y="162" font-size="9" text-anchor="middle">cat</text>
    <text x="306" y="162" font-size="9" text-anchor="middle">sat</text>
    <text x="194" y="258" font-size="8">attn</text>
    <text x="326" y="258" font-size="8" text-anchor="end">mlp</text>
    <text x="194" y="290" font-size="8">attn</text>
    <text x="326" y="290" font-size="8" text-anchor="end">mlp</text>
    <text x="194" y="322" font-size="8">attn</text>
    <text x="326" y="322" font-size="8" text-anchor="end">mlp</text>
    <text x="352" y="294" font-size="10">&#215;36</text>
    <text x="186" y="432" font-size="9">top_p 0.95 &#183; temp 0.7</text>
    <text x="194" y="468" font-size="10">&#9656; the mat.</text>
    <!-- annotations -->
