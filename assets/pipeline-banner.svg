    <text x="886" y="397" font-size="9">single stroke &#183; 1.5px</text>
    <text x="886" y="423" font-size="9">grid 36px &#183; radius 8pt</text>
    <text x="886" y="449" font-size="9">serif display + mono annotations</text>

    <!-- spec table -->
