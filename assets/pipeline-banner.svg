<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Abhyuday Patel — systems blueprint, fig 1.0: the serving loop</title>
  <desc id="description">A wireframe blueprint of an LLM inference engine with annotated internals — tokenizer, embeddings, transformer layers, paged KV cache, sampler — beside connected gateway, router, and deployment services.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E8542F" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" fill="#FAF4EA"/>
  <rect width="1200" height="620" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="600" fill="none" stroke="#E8542F"/>

  <g stroke="#E8542F" fill="none">
    <!-- ============ LEFT: INFERENCE ENGINE WIREFRAME ============ -->
    <rect x="170" y="92" width="180" height="390" rx="22" stroke-width="1.5"/>
    <line x1="170" y1="126" x2="350" y2="126"/>
    <!-- tokenizer -->
    <rect x="186" y="138" width="148" height="52" rx="8"/>
    <rect x="194" y="150" width="40" height="16" rx="4"/>
    <rect x="240" y="150" width="40" height="16" rx="4"/>
    <rect x="286" y="150" width="40" height="16" rx="4"/>
    <!-- embed -->
    <g>
      <rect x="194" y="208" width="12" height="12"/><rect x="211" y="208" width="12" height="12"/>
      <rect x="228" y="208" width="12" height="12"/><rect x="245" y="208" width="12" height="12"/>
      <rect x="262" y="208" width="12" height="12"/><rect x="279" y="208" width="12" height="12"/>
      <rect x="296" y="208" width="12" height="12"/><rect x="313" y="208" width="12" height="12"/>
    </g>
    <!-- layers -->
    <rect x="186" y="246" width="148" height="24" rx="6"/>
    <rect x="186" y="278" width="148" height="24" rx="6"/>
    <rect x="186" y="310" width="148" height="24" rx="6"/>
    <!-- paged KV cache -->
    <g>
      <rect x="186" y="352" width="16" height="12"><animate attributeName="fill" values="#E8542F" dur="6s" repeatCount="indefinite"/><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="211" y="352" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="0.35s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="236" y="352" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="0.7s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="261" y="352" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="1.05s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="286" y="352" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="1.4s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="311" y="352" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="1.75s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="186" y="370" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="2.1s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="211" y="370" width="16" height="12" fill="#E8542F" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.85;0.85;0" keyTimes="0;0.08;0.9;1" begin="2.45s" dur="6s" repeatCount="indefinite"/></rect>
      <rect x="236" y="370" width="16" height="12"/>
      <rect x="261" y="370" width="16" height="12"/>
      <rect x="286" y="370" width="16" height="12"/>
      <rect x="311" y="370" width="16" height="12"/>
