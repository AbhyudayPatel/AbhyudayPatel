    <!-- center -->
    <text x="600" y="76" font-size="12" letter-spacing="6" text-anchor="middle">&#8212; SYSTEMS BLUEPRINT &#8212;</text>
    <text x="486" y="372" font-size="16" letter-spacing="4">LLM INFERENCE &#215; PRODUCTION</text>
    <text x="486" y="402" font-size="12" letter-spacing="2" opacity="0.7">backend systems &#183; deployment engineering</text>

    <!-- right labels -->
