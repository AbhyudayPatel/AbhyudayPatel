    <text x="915" y="94" font-size="9" letter-spacing="2" text-anchor="middle">GATEWAY</text>
    <text x="1021" y="94" font-size="9" letter-spacing="2" text-anchor="middle">ROUTER</text>
    <text x="1127" y="94" font-size="9" letter-spacing="2" text-anchor="middle">DEPLOY</text>
