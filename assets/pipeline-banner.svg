      <line x1="158" y1="218" x2="182" y2="218"/>
      <line x1="158" y1="290" x2="182" y2="290"/>
      <line x1="158" y1="376" x2="182" y2="376"/>
      <line x1="158" y1="436" x2="182" y2="436"/>
