    <line x1="44" y1="506" x2="600" y2="506"/>
    <line x1="44" y1="551" x2="600" y2="551"/>
    <line x1="44" y1="596" x2="600" y2="596"/>
    <line x1="322" y1="506" x2="322" y2="596"/>
    <line x1="44" y1="506" x2="44" y2="596"/>
    <line x1="600" y1="506" x2="600" y2="596"/>

