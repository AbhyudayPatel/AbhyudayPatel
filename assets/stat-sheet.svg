<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="t d">
  <title id="t">Abhyuday Patel — stat sheet and trophy case, blueprint style</title>
  <desc id="d">Self-rated skill meters and shipped-work trophies drawn as an annotated wireframe specification.</desc>
  <defs>
    <pattern id="sgrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E8542F" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="252" fill="#FAF4EA"/>
  <rect width="1200" height="252" fill="url(#sgrid)"/>
  <rect x="8" y="8" width="1184" height="236" fill="none" stroke="#E8542F"/>

  <g stroke="#E8542F" fill="none">
    <!-- skill bars: outlined meters with animated fill -->
    <g>
      <rect x="300" y="64" width="560" height="11" rx="5.5"/>
      <rect x="300" y="64" height="11" rx="5.5" fill="#E8542F" stroke="none" width="0">
        <animate attributeName="width" values="0;532" dur="1.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="300" y="100" width="560" height="11" rx="5.5"/>
      <rect x="300" y="100" height="11" rx="5.5" fill="#E8542F" stroke="none" width="0">
        <animate attributeName="width" values="0;521" dur="1.3s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="300" y="136" width="560" height="11" rx="5.5"/>
      <rect x="300" y="136" height="11" rx="5.5" fill="#E8542F" stroke="none" width="0">
        <animate attributeName="width" values="0;504" dur="1.3s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="300" y="172" width="560" height="11" rx="5.5"/>
      <rect x="300" y="172" height="11" rx="5.5" fill="#E8542F" stroke="none" width="0">
        <animate attributeName="width" values="0;493" dur="1.3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
      <rect x="300" y="208" width="560" height="11" rx="5.5"/>
      <rect x="300" y="208" height="11" rx="5.5" fill="#E8542F" stroke="none" width="0">
        <animate attributeName="width" values="0;476" dur="1.3s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </g>
    <!-- annotation ticks -->
    <g stroke-dasharray="3 3">
      <line x1="240" y1="69" x2="296" y2="69"/>
      <line x1="240" y1="105" x2="296" y2="105"/>
      <line x1="240" y1="141" x2="296" y2="141"/>
      <line x1="240" y1="177" x2="296" y2="177"/>
      <line x1="240" y1="213" x2="296" y2="213"/>
    </g>
    <line x1="920" y1="30" x2="920" y2="226"/>
    <!-- trophy markers -->
    <rect x="946" y="62" width="11" height="11"/>
    <rect x="946" y="98" width="11" height="11"/>
    <rect x="946" y="134" width="11" height="11"/>
    <rect x="946" y="170" width="11" height="11"/>
    <rect x="946" y="206" width="11" height="11"/>
  </g>

  <g fill="#E8542F" font-family="Consolas, Menlo, 'Courier New', monospace">
    <text x="48" y="42" font-size="12" font-weight="bold" letter-spacing="3">STAT SHEET</text>
    <text x="300" y="42" font-size="10" opacity="0.7">self-rated &#183; battle-tested in production</text>
    <g font-size="11" text-anchor="end">
      <text x="232" y="78">LLM INFERENCE &amp; SERVING</text>
      <text x="232" y="114">BACKEND &amp; API DESIGN</text>
      <text x="232" y="150">DEPLOYMENT &amp; INFRA</text>
      <text x="232" y="186">AGENT SYSTEMS</text>
      <text x="232" y="222">REALTIME VOICE</text>
    </g>
    <g font-size="11" font-weight="bold">
      <text x="876" y="78">95%</text>
      <text x="876" y="114">93%</text>
      <text x="876" y="150">90%</text>
      <text x="876" y="186">88%</text>
      <text x="876" y="222">85%</text>
    </g>
    <text x="946" y="42" font-size="12" font-weight="bold" letter-spacing="3">TROPHY CASE</text>
    <g font-size="10.5">
      <text x="966" y="72">2&#215; 1ST PLACE &#183; HACKATHONS</text>
      <text x="966" y="108">DUOTALK ON PYPI</text>
      <text x="966" y="144">78.9% &#183; APPWORLD DEV</text>
      <text x="966" y="180">2&#215; CO-FOUNDER</text>
      <text x="966" y="216">FIRST HIRE &#183; TIMELN</text>
    </g>
  </g>
</svg>
